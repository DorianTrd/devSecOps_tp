services:
  app-back-blue:
    image: "${DOCKERHUB_USERNAME}/cloudnative-backend-blue:${GITHUB_SHA}"
    environment:
      DATABASE_URL: "postgresql://myuser:mypassword@db:5432/mydatabase"
    depends_on:
      - db
    networks:
      - app-network

  app-front-blue:
    image: "${DOCKERHUB_USERNAME}/cloudnative-frontend-blue:${GITHUB_SHA}"
    depends_on:
      - app-back-blue
    networks:
      - app-network

networks:
  app-network:
    external: true